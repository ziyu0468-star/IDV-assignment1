<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pollutant Standards Index · Singapore</title>
  <style>
    :root{--green:#278d16;--green-dark:#18720d;--green-light:#c9efc8;--green-line:#529851;--ink:#17351b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#b9e6b6;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    .page{width:min(1100px,92%);margin:0 auto;padding:70px 0 48px;text-align:center}
    h1{font-size:clamp(30px,4vw,48px);margin:0 0 10px;font-weight:700;letter-spacing:-1.2px}
    h2{font-size:27px;margin:0 0 12px}
    .status{font-size:20px;font-weight:700;margin:0 0 30px;color:#236f1b}
    .table-shell{overflow-x:auto;box-shadow:0 2px 8px #376f3630}
    table{width:100%;border-collapse:collapse;min-width:720px;text-align:left;background:#c5edc2}
    thead{background:var(--green);color:#133d0e}
    th,td{border:2px solid var(--green-line);padding:11px 14px}
    th{font-size:17px;font-weight:700;text-transform:lowercase}
    th:first-child,td:first-child{width:42%;text-align:left}
    th:not(:first-child),td:not(:first-child){text-align:center}
    tbody tr:nth-child(even){background:#bce8b9}
    td{font-size:16px;font-weight:600}
    td:first-child{font-weight:600}
    .actions{margin:21px 0}
    button{border:2px solid #478a43;background:#87ce7c;color:#194619;padding:9px 20px;font-size:15px;font-weight:700;cursor:pointer;border-radius:3px}
    button:hover{background:#9cdd92}
    button:focus-visible{outline:3px solid #174c17;outline-offset:3px}
    .updated{font-size:14px;font-weight:700;margin:22px 0 5px}
    .credit{font-size:14px;margin:0}.credit a{color:#273fbd;text-decoration:underline}
    .note{font-size:12px;color:#3f6340;margin-top:12px}
    @media(max-width:600px){.page{padding-top:38px}h1{font-size:32px}.status{font-size:17px}th,td{padding:9px 10px}}
  </style>
</head>
<body>
  <main class="page">
    <h1>Pollutant Standards Index</h1>
    <h2>Singapore</h2>
    <p class="status">Status: Healthy</p>

    <div class="table-shell">
      <table aria-label="Pollutant Standards Index readings by Singapore region">
        <thead><tr><th>Metric</th><th>central</th><th>west</th><th>east</th><th>north</th><th>south</th></tr></thead>
        <tbody id="readings"></tbody>
      </table>
    </div>

    <div class="actions"><button id="refresh" type="button">Refresh</button></div>
    <p class="updated">Example readings from the supplied reference image</p>
    <p class="credit">Data format based on <a href="https://data.gov.sg/">Singapore Government Agency</a> PSI fields</p>
    <p class="note" id="notice" role="status">These are static example values; refresh redraws the table and does not fetch live data.</p>
  </main>
  <script>
    const readings = [
      ['o3_sub_index',27,16,25,39,21],
      ['pm10_twenty_four_hourly',99,104,86,68,69],
      ['pm10_sub_index',75,77,69,59,60],
      ['co_sub_index',8,7,8,9,7],
      ['pm25_twenty_four_hourly',75,72,55,49,50],
      ['so2_sub_index',4,4,3,4,3],
      ['co_eight_hour_max',1,1,1,1,1],
      ['no2_one_hour_max',19,21,11,9,14],
      ['so2_twenty_four_hourly',6,7,5,6,5],
      ['pm25_sub_index',122,118,100,93,94],
      ['psi_twenty_four_hourly',122,118,100,93,94],
      ['o3_eight_hour_max',64,37,59,92,49]
    ];
    const tableBody = document.getElementById('readings');
    function renderTable(){
      tableBody.innerHTML = readings.map(row => `<tr><td>${row[0]}</td>${row.slice(1).map(value => `<td>${value}</td>`).join('')}</tr>`).join('');
      document.getElementById('notice').textContent = 'Table refreshed locally · Static example values; no live data was requested.';
    }
    document.getElementById('refresh').addEventListener('click',renderTable);
    renderTable();
  </script>
</body>
</html>
